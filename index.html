<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Music Player</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.player{width:min(420px,90vw);padding:28px;border-radius:25px;background:#202020;box-shadow:0 20px 60px #000}
.cover{height:320px;border-radius:20px;background:linear-gradient(135deg,#ff7b54,#713cff);display:grid;place-items:center;font-size:90px}
h1{margin:25px 0 5px}.artist{color:#aaa}.bar{width:100%;margin-top:25px}.times{display:flex;justify-content:space-between;color:#888;font-size:12px}
.controls{display:flex;justify-content:center;align-items:center;gap:25px;margin:25px 0}.controls button{border:0;background:none;color:white;font-size:28px;cursor:pointer}.play{background:white!important;color:#111!important;width:65px;height:65px;border-radius:50%}
.list{display:grid;gap:8px}.song{padding:13px;border-radius:12px;background:#292929;cursor:pointer}.song.active{background:#444}
</style></head>
<body><div class="player">
<div class="cover">🎵</div>
<h1 id="title">Pretender</h1><div class="artist" id="artist">Official髭男dism</div>
<input id="seek" class="bar" type="range" min="0" max="100" value="0">
<div class="times"><span id="now">0:00</span><span id="total">0:00</span></div>
<div class="controls"><button id="prev">⏮</button><button id="play" class="play">▶</button><button id="next">⏭</button></div>
<div>🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div>
<div class="list" id="list"></div>
<audio id="audio" preload="metadata"></audio>
</div>
<script>
const songs=[
 {title:"Pretender",artist:"Official髭男dism",file:"Pretender.mp3"},
 {title:"水平線",artist:"back number",file:"suiheisen.mp3"}
];
const audio=document.getElementById("audio"), play=document.getElementById("play"),seek=document.getElementById("seek"),vol=document.getElementById("vol");
let n=0;

function time(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function list(){document.getElementById("list").innerHTML=songs.map((s,i)=>`<div class="song ${i==n?'active':''}" onclick="load(${i},true)">${i+1}. ${s.title}<br><small>${s.artist}</small></div>`).join("")}
function load(i,auto=false){
 n=(i+songs.length)%songs.length;
 document.getElementById("title").textContent=songs[n].title;
 document.getElementById("artist").textContent=songs[n].artist;
 audio.pause();
 audio.src=songs[n].file;
 audio.load();
 list();
 if(auto) audio.play().catch(e=>alert("재생할 수 없습니다: "+e.message));
}
play.onclick=()=>audio.paused?audio.play():audio.pause();
document.getElementById("prev").onclick=()=>load(n-1,true);
document.getElementById("next").onclick=()=>load(n+1,true);
vol.oninput=()=>audio.volume=vol.value;
audio.volume=.8;
audio.onloadedmetadata=()=>document.getElementById("total").textContent=time(audio.duration);
audio.ontimeupdate=()=>{
 document.getElementById("now").textContent=time(audio.currentTime);
 seek.value=audio.duration?(audio.currentTime/audio.duration*100):0;
};
seek.oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*seek.value/100};
audio.onplay=()=>play.textContent="❚❚";
audio.onpause=()=>play.textContent="▶";
audio.onended=()=>load(n+1,true);
load(0);
</script></body></html>
