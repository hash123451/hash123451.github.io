<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody Player</title>
<style>
*{box-sizing:border-box} :root{--bg:#090a0f;--card:#12141c;--card2:#191c26;--text:#f5f6fa;--muted:#9298a8;--line:rgba(255,255,255,.09);--accent:#9b7cff}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#28213d 0,#090a0f 44%);color:var(--text);font-family:Inter,Pretendard,Arial,sans-serif}
button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{max-width:680px;margin:auto;padding:28px 18px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-size:24px;font-weight:850;letter-spacing:-1px}.logo span{color:#a78bfa}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;font-size:18px}
.card{background:rgba(18,20,28,.9);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.8px}.badge{color:#cbbcff;background:rgba(155,124,255,.1);padding:7px 11px;border-radius:99px;letter-spacing:0}
.art{width:min(100%,410px);aspect-ratio:1;margin:27px auto;border-radius:28px;padding:1px;background:linear-gradient(135deg,#a78bfa,#ec4899,#f59e0b);box-shadow:0 24px 55px rgba(0,0,0,.4)}
.artIn{height:100%;border-radius:27px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 20%),linear-gradient(145deg,#242130,#0d0e13);display:grid;place-items:center}
.disc{width:62%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#101014 0 4px,#2b2b31 5px 7px);border:17px solid #17171b;box-shadow:inset 0 0 30px #000,0 18px 35px #0007;position:relative}.disc:after{content:"";position:absolute;inset:41%;border-radius:50%;background:#ddd8ff;box-shadow:0 0 0 10px var(--accent)}.playing .disc{animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.meta{display:flex;justify-content:space-between;align-items:center}.title{font-size:30px;font-weight:850;letter-spacing:-1.2px}.artist{margin-top:6px;color:var(--muted)}.heart{font-size:30px}.heart.on{color:#f472b6}
.range{width:100%;appearance:none;height:5px;border-radius:8px;margin-top:28px;background:linear-gradient(to right,var(--accent) 0 var(--p,0%),#353944 var(--p,0%) 100%)}.range::-webkit-slider-thumb{appearance:none;width:15px;height:15px;background:white;border-radius:50%;box-shadow:0 2px 10px #000}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.controls{display:grid;grid-template-columns:1fr 1fr 1.45fr 1fr 1fr;align-items:center;margin:25px 0 14px}.ctrl{height:52px;font-size:21px;color:#d3d7df}.ctrl.active{color:#a78bfa}.play{width:72px;height:72px;border-radius:50%;background:#f5f5f7;color:#111;margin:auto;font-size:24px;box-shadow:0 10px 30px #fff2}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center;align-items:center}.tool{padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#151822;color:#c7cbd5;font-size:13px}.tool:hover,.tool.active{border-color:#8f73f5;background:#211d32;color:#e8e1ff}
#timerPanel{display:none;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#0d0f15}.timerTop{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px}.timerChoices{display:flex;gap:7px;flex-wrap:wrap}.timerChoices button{padding:8px 11px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px}
.customTimer{margin-top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.customTimer input{width:48px;padding:8px 4px;text-align:center;background:#11131a;border:1px solid var(--line);border-radius:9px;color:#fff;outline:none}
.customTimer b{font-size:11px;font-weight:500}.customTimer button,.customCancel button{padding:8px 11px;border-radius:10px;background:#29233c;border:1px solid rgba(167,139,250,.3);font-size:12px;color:#e7dfff}
.customCancel{margin-top:10px}
.playlistView{display:none}.playlistHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.playlistHead h2{margin:0;font-size:22px}.back{padding:10px 13px;border:1px solid var(--line);border-radius:12px}.search{width:100%;padding:13px 15px;background:#0c0e14;border:1px solid var(--line);border-radius:14px;color:#fff;outline:none;margin-bottom:12px}.song{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:13px 10px;border-radius:16px;cursor:pointer}.song:hover,.song.active{background:#1a1d27}.num{color:var(--muted);font-size:12px;text-align:center}.song.active .num{color:#a78bfa}.songName{font-size:14px;font-weight:750}.songArtist{font-size:12px;color:var(--muted);margin-top:4px}.nowMark{font-size:12px;color:#a78bfa}.empty{text-align:center;color:var(--muted);padding:35px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,100px);background:#f5f5f7;color:#121318;padding:12px 17px;border-radius:14px;font-size:13px;transition:.25s;z-index:9;white-space:nowrap}.toast.show{transform:translate(-50%,0)}
@media(max-width:480px){.app{padding:20px 12px 70px}.card{padding:22px 16px}.title{font-size:26px}.art{margin:22px auto}.tools{gap:6px}.tool{font-size:12px;padding:9px 10px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Melody <span>Player</span></div></header>

<div class="card" id="mainCard">
  <section id="playerView">
    <div class="top"><span>NOW PLAYING</span><span class="badge" id="trackNo">01 / 07</span></div>
    <div class="art"><div class="artIn"><div class="disc"></div></div></div>
    <div class="meta"><div><div class="title" id="title">Pretender</div><div class="artist" id="artist">Official HIGE DANDISM</div></div><button class="heart" id="like">♡</button></div>
    <input class="range" id="seek" type="range" min="0" max="100" value="0">
    <div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>
    <div class="controls">
      <button class="ctrl" id="shuffle">⇄</button><button class="ctrl" id="prev">|◀</button>
      <button class="play" id="play">▶</button>
      <button class="ctrl" id="next">▶|</button><button class="ctrl" id="repeat">↻</button>
    </div>
    <div class="tools">
      <button class="tool" id="mute">🔊 <span id="volumeText">25 %</span></button>
      <button class="tool" id="speed">1.0×</button>
      <button class="tool" id="sleep">☾ 취침 타이머</button>
      <button class="tool" id="playlistBtn">☰ 재생 목록</button>
    </div>
    <div id="timerPanel">
      <div class="timerTop"><b>취침 타이머</b><span id="timerStatus">설정 안 됨</span></div>
      <div class="timerChoices"><button data-min="5">5분</button><button data-min="10">10분</button><button data-min="30">30분</button><button data-min="60">60분</button></div>
      <div class="customTimer">
        <span>커스텀</span>
        <input id="customH" type="number" min="0" max="99" value="0" placeholder="00"><b>시간</b>
        <input id="customM" type="number" min="0" max="59" value="0" placeholder="00"><b>분</b>
        <input id="customS" type="number" min="0" max="59" value="0" placeholder="00"><b>초</b>
        <button id="customStart">시작</button>
      </div>
      <div class="customCancel"><button id="timerCancel">타이머 취소</button></div>
    </div>
  </section>

  <section class="playlistView" id="playlistView">
    <div class="playlistHead"><div><h2>재생 목록</h2><span style="color:var(--muted);font-size:12px">내 라이브러리 · 7곡</span></div><button class="back" id="backPlayer">← 플레이어</button></div>
    <input class="search" id="search" placeholder="노래 또는 아티스트 검색">
    <div id="songList"></div>
  </section>
</div>
</div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
const songs=[
 {title:'Pretender',artist:'Official HIGE DANDISM',file:'Pretender.mp3'},
 {title:'수평선',artist:'back number',file:'suiheisen.mp3'},
 {title:'CROOKED',artist:'G-DRAGON',file:'CROOKED.mp3'},
 {title:'Fantastic Baby',artist:'BIGBANG',file:'Fantastic Baby.mp3'},
 {title:'HAPPY',artist:'DAY6',file:'HAPPY.mp3'},
 {title:'단',artist:'Huh Gak',file:'단.mp3'},
 {title:'참 다행이야',artist:'S.Papa',file:'참 다행이야.mp3'}
];
const $=s=>document.querySelector(s),audio=$('#audio');
let index=0,shuffleOn=false,repeatMode=0,liked=new Set(),volume=.8,speed=1,sleepTimeout=null,sleepEnd=0,tick=null;
function fmt(s){return isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function render(){
 const s=songs[index];$('#title').textContent=s.title;$('#artist').textContent=s.artist;$('#trackNo').textContent=String(index+1).padStart(2,'0')+' / '+String(songs.length).padStart(2,'0');
 $('#like').textContent=liked.has(index)?'♥':'♡';$('#like').classList.toggle('on',liked.has(index));
 document.querySelectorAll('.song').forEach(x=>x.classList.toggle('active',Number(x.dataset.i)===index));
}
function load(i,autoplay=false){
 index=(i+songs.length)%songs.length;audio.pause();audio.src='./'+encodeURIComponent(songs[index].file);audio.load();
 $('#seek').value=0;$('#seek').style.setProperty('--p','0%');$('#current').textContent='0:00';render();
 if(autoplay)audio.play().catch(()=>toast('재생 오류: '+songs[index].file));
}
function nextSong(){
 if(shuffleOn){let n=index;while(n===index&&songs.length>1)n=Math.floor(Math.random()*songs.length);load(n,true)}
 else load(index+1,true);
}
function drawList(q=''){
 q=q.toLowerCase();const box=$('#songList');box.innerHTML='';
 songs.forEach((s,i)=>{if(!(s.title+' '+s.artist).toLowerCase().includes(q))return;
  const e=document.createElement('div');e.className='song';e.dataset.i=i;
  e.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')}</div><div><div class="songName">${s.title}</div><div class="songArtist">${s.artist}</div></div><div class="nowMark">${i===index?'●':''}</div>`;
  e.onclick=()=>{load(i,true);showPlayer()};box.appendChild(e);
 });if(!box.children.length)box.innerHTML='<div class="empty">검색 결과가 없습니다</div>';render();
}
function showPlaylist(){$('#playerView').style.display='none';$('#playlistView').style.display='block';drawList($('#search').value)}
function showPlayer(){$('#playlistView').style.display='none';$('#playerView').style.display='block'}
$('#playlistBtn').onclick=showPlaylist;$('#backPlayer').onclick=showPlayer;
$('#search').oninput=e=>drawList(e.target.value);

$('#play').onclick=()=>audio.paused?audio.play():audio.pause();
audio.onplay=()=>{$('#play').textContent='❚❚';$('#mainCard').classList.add('playing')};
audio.onpause=()=>{$('#play').textContent='▶';$('#mainCard').classList.remove('playing')};
$('#prev').onclick=()=>load(index-1,true);$('#next').onclick=nextSong;
$('#shuffle').onclick=function(){shuffleOn=!shuffleOn;this.classList.toggle('active',shuffleOn);toast(shuffleOn?'셔플 켜짐':'셔플 꺼짐')};
$('#repeat').onclick=function(){repeatMode=(repeatMode+1)%3;this.classList.toggle('active',repeatMode>0);this.textContent=repeatMode===2?'↻¹':'↻';toast(['반복 끔','전체 반복','한 곡 반복'][repeatMode])};
$('#like').onclick=()=>{liked.has(index)?liked.delete(index):liked.add(index);render()};
$('#speed').onclick=function(){speed=speed===1?1.25:speed===1.25?1.5:speed===1.5?0.75:1;audio.playbackRate=speed;this.textContent=speed.toFixed(2).replace(/0$/,'')+'×';toast('재생 속도 '+this.textContent)};
// 볼륨 버튼을 누를 때마다 5% → 25% → 50% → 75% → 100% 순서로 변경
const volumeSteps=[0,5,25,50,75,100];
let volumeStepIndex=2; // 처음 25%
function updateVolumeStep(){
  const percent=volumeSteps[volumeStepIndex];
  volume=percent/100;
  audio.volume=volume;
  $('#volumeText').textContent=percent+' %';
}
$('#mute').onclick=()=>{
  volumeStepIndex=(volumeStepIndex+1)%volumeSteps.length;
  updateVolumeStep();
  toast('볼륨 '+volumeSteps[volumeStepIndex]+' %');
};
audio.onloadedmetadata=()=>{$('#duration').textContent=fmt(audio.duration);drawList($('#search').value)};
audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;$('#seek').value=p;$('#seek').style.setProperty('--p',p+'%');$('#current').textContent=fmt(audio.currentTime)};
$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
audio.onended=()=>{if(repeatMode===2){audio.currentTime=0;audio.play()}else if(index<songs.length-1||repeatMode===1)nextSong()};

// 취침 타이머 실제 동작 + 커스텀 시:분:초
function updateTimer(){
  if(!sleepEnd){$('#timerStatus').textContent='설정 안 됨';return}
  const left=Math.max(0,Math.ceil((sleepEnd-Date.now())/1000));
  const h=Math.floor(left/3600), m=Math.floor((left%3600)/60), s=left%60;
  $('#timerStatus').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' 남음';
}
function startSleepTimer(seconds,label){
  if(seconds<=0){toast('시간을 1초 이상 설정해주세요');return}
  clearTimeout(sleepTimeout);clearInterval(tick);
  sleepEnd=Date.now()+seconds*1000;
  sleepTimeout=setTimeout(()=>{
    audio.pause();sleepEnd=0;clearInterval(tick);updateTimer();
    toast('취침 타이머 종료 · 음악을 멈췄습니다');
  },seconds*1000);
  tick=setInterval(updateTimer,500);updateTimer();
  toast(label+' 후 자동 정지됩니다');
}
$('#sleep').onclick=()=>{$('#timerPanel').style.display=$('#timerPanel').style.display==='block'?'none':'block'};
document.querySelectorAll('.timerChoices button[data-min]').forEach(b=>b.onclick=()=>{
  const min=Number(b.dataset.min);startSleepTimer(min*60,min+'분');
});
$('#customStart').onclick=()=>{
  const h=Math.max(0,Number($('#customH').value)||0);
  const m=Math.min(59,Math.max(0,Number($('#customM').value)||0));
  const s=Math.min(59,Math.max(0,Number($('#customS').value)||0));
  startSleepTimer(h*3600+m*60+s,String(h).padStart(2,'0')+'시간 '+String(m).padStart(2,'0')+'분 '+String(s).padStart(2,'0')+'초');
};
$('#timerCancel').onclick=()=>{clearTimeout(sleepTimeout);clearInterval(tick);sleepEnd=0;updateTimer();toast('취침 타이머 취소')};

audio.onerror=()=>toast('파일을 불러올 수 없습니다: '+songs[index].file);
audio.volume=.25;volume=.25;drawList();load(0);
</script>
</body></html>
