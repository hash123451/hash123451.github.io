<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samsung Music Style Player</title>
<style>
:root{--bg:#090a0d;--panel:#15161b;--panel2:#1c1e24;--line:#2b2e36;--text:#f4f4f6;--muted:#9ea1aa;--accent:#7c5cff;--accent2:#a79aff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;height:100%;overflow:hidden}button,input{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto;background:radial-gradient(circle at 50% 20%,#23202f 0,#101116 42%,#090a0d 76%);position:relative;overflow:hidden}.top{height:70px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2}.brand{font-size:18px;font-weight:800;letter-spacing:-.4px}.top-actions{display:flex;gap:8px}.icon-btn{border:0;background:transparent;color:var(--text);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;transition:.2s}.icon-btn:hover,.icon-btn.active{background:#292b32;color:#fff}.screen{flex:1;overflow:auto;padding:0 22px 98px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.nowplaying{display:block}.art-wrap{width:min(76vw,390px);aspect-ratio:1;margin:8px auto 28px;position:relative}.art{width:100%;height:100%;border-radius:28px;background:linear-gradient(135deg,#5839b8,#15122b 58%,#9b4774);box-shadow:0 28px 70px rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:background .45s,transform .3s}.art::after{content:"";position:absolute;inset:10%;border:1px solid rgba(255,255,255,.15);border-radius:22px}.art .disc{width:55%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#222 0 2px,#111 3px 5px);box-shadow:0 0 0 18px rgba(255,255,255,.05);position:relative}.disc:after{content:"♫";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#eee}.playing .disc{animation:spin 10s linear infinite}.paused .disc{animation-play-state:paused}@keyframes spin{to{transform:rotate(360deg)}}.song-head{display:flex;align-items:center;gap:12px}.song-meta{flex:1;min-width:0}.title{font-size:27px;font-weight:800;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:15px;color:var(--muted);margin-top:5px}.heart{font-size:25px}.progress-wrap{margin:28px 0 8px}.range{width:100%;appearance:none;height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) 0 var(--p,0%),#555  var(--p,0%) 100%);outline:none;cursor:pointer}.range::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #000}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.controls{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 20px}.control{border:0;background:transparent;color:#eee;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer;transition:.2s}.control:hover,.control.active{color:var(--accent2);background:#202128}.play{width:70px;height:70px;background:#f4f4f6;color:#111;font-size:29px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.play:hover{background:#fff;color:#111}.secondary{display:flex;justify-content:space-between;margin-top:6px}.secondary button{flex:1;border:0;border-radius:14px;background:transparent;color:var(--muted);padding:13px 4px;cursor:pointer}.secondary button:hover{background:#1b1d23;color:#fff}.queue-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}.queue-head h2{font-size:18px;margin:0}.small-btn{border:0;background:#24262d;color:#ddd;padding:8px 12px;border-radius:12px;cursor:pointer}.queue{display:grid;gap:7px}.track{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;cursor:pointer;transition:.18s}.track:hover,.track.active{background:#202228}.track-no{width:24px;color:#8f929a;text-align:center;font-size:13px}.mini-art{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--g,#513ca3);font-size:18px}.track-info{flex:1;min-width:0}.track-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-artist{font-size:12px;color:var(--muted);margin-top:3px}.more{border:0;background:none;color:#aaa;font-size:20px;cursor:pointer}.bottom{position:absolute;left:0;right:0;bottom:0;height:76px;background:rgba(18,19,24,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:max(0px,env(safe-area-inset-bottom));z-index:5}.nav-btn{border:0;background:none;color:#858891;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;cursor:pointer;min-width:58px}.nav-btn span:first-child{font-size:21px}.nav-btn.active{color:#fff}.library{display:none}.library.show{display:block}.nowplaying.hide{display:none}.library h1{font-size:34px;margin:12px 0 6px;letter-spacing:-1.5px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}.search{width:100%;background:#202228;border:1px solid #30333c;border-radius:16px;color:#fff;padding:14px 16px;outline:none}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#f3f3f5;color:#111;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:100%;background:#202127;border-radius:28px 28px 0 0;padding:20px 22px 30px}.sheet h3{margin:0 0 15px}.sheet button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#eee;padding:15px;border-radius:12px;cursor:pointer}.sheet button:hover{background:#2c2e36}@media(min-width:800px){.app{box-shadow:0 0 60px #000}.screen{padding-left:38px;padding-right:38px}.art-wrap{width:360px}}
</style>
</head>
<body>
<div class="app" id="app">
 <header class="top"><div class="brand">Samsung Music</div><div class="top-actions"><button class="icon-btn" id="sleepBtn" title="취침 타이머">◴</button><button class="icon-btn" id="moreBtn" title="더보기">⋮</button></div></header>
 <main class="screen">
  <section class="nowplaying" id="nowPlaying">
   <div class="art-wrap"><div class="art playing" id="art"><div class="disc"> </div></div></div>
   <div class="song-head"><div class="song-meta"><div class="title" id="title"></div><div class="artist" id="artist"></div></div><button class="icon-btn heart" id="likeBtn" title="좋아요">♡</button></div>
   <div class="progress-wrap"><input class="range" id="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></div>
   <div class="controls"><button class="control" id="shuffleBtn" title="셔플">⇄</button><button class="control" id="prevBtn" title="이전 곡">⏮</button><button class="control play" id="playBtn" title="재생">▶</button><button class="control" id="nextBtn" title="다음 곡">⏭</button><button class="control" id="repeatBtn" title="반복">↻</button></div>
   <div class="secondary"><button id="volumeBtn">🔊 <span id="volText">80%</span></button><button id="queueBtn">☰ 재생 목록</button><button id="speedBtn">1.0×</button></div>
   <div class="queue-head"><h2>다음 재생</h2><button class="small-btn" id="sortBtn">정렬</button></div><div class="queue" id="queue"></div>
  </section>
  <section class="library" id="library"><h1>내 음악</h1><div class="sub" id="countText"></div><input class="search" id="search" placeholder="노래 또는 아티스트 검색"><div class="queue" id="libraryList" style="margin-top:16px"></div></section>
 </main>
 <nav class="bottom"><button class="nav-btn active" data-page="player"><span>▶</span>재생 중</button><button class="nav-btn" data-page="library"><span>♫</span>노래</button><button class="nav-btn" id="favoritesNav"><span>♡</span>좋아요</button></nav>
 <div class="modal" id="modal"><div class="sheet" id="sheet"><h3>옵션</h3><button id="timer15">15분 후 정지</button><button id="timer30">30분 후 정지</button><button id="timerOff">취침 타이머 끄기</button><button id="closeModal">취소</button></div></div>
 <div class="toast" id="toast"></div><audio id="audio" preload="metadata"></audio>
</div>
<script>
const songs=[
 {title:'Pretender',artist:'Official HIGE DANDISM',file:'Pretender.mp3',g:'linear-gradient(135deg,#6136a9,#d4577e)'},
 {title:'水平線',artist:'back number',file:'suiheisen.mp3',g:'linear-gradient(135deg,#176c9c,#5a9dc1)'},
 {title:'CROOKED',artist:'G-DRAGON',file:'SpotiDownloader.com - CROOKED - G-DRAGON.mp3',g:'linear-gradient(135deg,#bd2f55,#241024)'},
 {title:'Fantastic Baby',artist:'BIGBANG',file:'SpotiDownloader.com - Fantastic Baby - BIGBANG.mp3',g:'linear-gradient(135deg,#d7a016,#4c2632)'},
 {title:'HAPPY',artist:'DAY6',file:'SpotiDownloader.com - HAPPY - DAY6.mp3',g:'linear-gradient(135deg,#258e78,#193b65)'},
 {title:'단',artist:'Huh Gak',file:'단.mp3',g:'linear-gradient(135deg,#9d6d50,#2d1d1c)'},
 {title:'참 다행이야',artist:'S.Papa',file:'참 다행이야.mp3',g:'linear-gradient(135deg,#6f8d48,#254235)'}
];
const $=s=>document.querySelector(s), audio=$('#audio');let index=0,shuffle=false,repeat=0,liked=new Set(),speed=1,timer=null,order=[...songs.keys()];
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const s=songs[index];$('#title').textContent=s.title;$('#artist').textContent='- '+s.artist;$('#art').style.background=s.g;$('#likeBtn').textContent=liked.has(index)?'♥':'♡';$('#likeBtn').classList.toggle('active',liked.has(index));document.title=s.title+' · Samsung Music';renderQueue();renderLibrary();}
function renderQueue(){const next=[];for(let i=1;i<=songs.length;i++)next.push((index+i)%songs.length);$('#queue').innerHTML=next.slice(0,5).map(i=>trackHTML(i,false)).join('')}
function renderLibrary(filter=''){const q=filter.trim().toLowerCase();const arr=songs.map((s,i)=>i).filter(i=>(songs[i].title+songs[i].artist).toLowerCase().includes(q));$('#libraryList').innerHTML=arr.map(i=>trackHTML(i,true)).join('');$('#countText').textContent=q?arr.length+'곡 검색됨':songs.length+'곡';}
function trackHTML(i,showNum){const s=songs[i];return `<div class="track ${i===index?'active':''}" data-track="${i}"><div class="track-no">${showNum?i+1:'▶'}</div><div class="mini-art" style="--g:${s.g};background:${s.g}">♫</div><div class="track-info"><div class="track-title">${esc(s.title)}-${esc(s.artist)}</div></div><button class="more" data-more="${i}">⋮</button></div>`}
function load(i,autoplay=false){index=(i+songs.length)%songs.length;audio.src=encodeURI(songs[index].file);audio.load();$('#seek').value=0;$('#seek').style.setProperty('--p','0%');render();if(autoplay)audio.play().catch(()=>toast('재생 버튼을 눌러 시작하세요'));}
function toggle(){audio.paused?audio.play():audio.pause()}
function updatePlay(){const playing=!audio.paused;$('#playBtn').textContent=playing?'Ⅱ':'▶';$('#art').classList.toggle('playing',playing);$('#art').classList.toggle('paused',!playing)}
function next(){if(shuffle){let n=index;while(n===index&&songs.length>1)n=Math.floor(Math.random()*songs.length);load(n,true)}else load(index+1,true)}
function prev(){if(audio.currentTime>3){audio.currentTime=0}else load(index-1,true)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
$('#playBtn').onclick=toggle;$('#nextBtn').onclick=next;$('#prevBtn').onclick=prev;
$('#shuffleBtn').onclick=()=>{shuffle=!shuffle;$('#shuffleBtn').classList.toggle('active',shuffle);toast(shuffle?'셔플 켜짐':'셔플 꺼짐')};
$('#repeatBtn').onclick=()=>{repeat=(repeat+1)%3;$('#repeatBtn').classList.toggle('active',repeat>0);$('#repeatBtn').textContent=repeat===2?'↻1':'↻';toast(['반복 없음','전체 반복','한 곡 반복'][repeat])};
$('#likeBtn').onclick=()=>{liked.has(index)?liked.delete(index):liked.add(index);render();toast(liked.has(index)?'좋아요에 추가됨':'좋아요에서 제거됨')};
$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*(e.target.value/100)};
audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;$('#seek').value=p;$('#seek').style.setProperty('--p',p+'%');$('#current').textContent=fmt(audio.currentTime)};
audio.onloadedmetadata=()=>$('#duration').textContent=fmt(audio.duration);audio.onplay=updatePlay;audio.onpause=updatePlay;audio.onended=()=>{if(repeat===2){audio.currentTime=0;audio.play()}else if(repeat===1||index<songs.length-1)next()};
$('#queueBtn').onclick=()=>{document.querySelector('[data-page="library"]').click();setTimeout(()=>$('#libraryList').scrollIntoView({behavior:'smooth'}),50)};
$('#speedBtn').onclick=()=>{speed=speed===1?1.25:speed===1.25?1.5:1;audio.playbackRate=speed;$('#speedBtn').textContent=speed.toFixed(2).replace('.00','')+'×';toast('재생 속도 '+speed+'×')};
$('#volumeBtn').onclick=()=>{audio.muted=!audio.muted;$('#volumeBtn').firstChild.textContent=audio.muted?'🔇 ':'🔊 ';$('#volText').textContent=audio.muted?'음소거':'80%'};
$('#sortBtn').onclick=()=>{songs.reverse();index=songs.findIndex(s=>s.file===decodeURI(audio.src.split('/').pop()));if(index<0)index=0;render();toast('곡 순서를 반대로 정렬했습니다')};
$('#search').oninput=e=>renderLibrary(e.target.value);
document.addEventListener('click',e=>{const t=e.target.closest('[data-track]');if(t&&!e.target.closest('.more'))load(+t.dataset.track,true);const m=e.target.closest('[data-more]');if(m){index=+m.dataset.more;render();toast('선택: '+songs[index].title)}});
document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const lib=b.dataset.page==='library';$('#nowPlaying').classList.toggle('hide',lib);$('#library').classList.toggle('show',lib)});
$('#favoritesNav').onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));$('#favoritesNav').classList.add('active');$('#nowPlaying').classList.add('hide');$('#library').classList.add('show');const ids=[...liked];$('#libraryList').innerHTML=ids.length?ids.map(i=>trackHTML(i,true)).join(''):'<div class="sub" style="padding:30px 8px">아직 좋아요를 누른 곡이 없습니다.</div>';$('#countText').textContent='좋아요한 곡 '+ids.length+'곡'};
function openModal(){$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
$('#sleepBtn').onclick=openModal;$('#moreBtn').onclick=openModal;$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
function setTimer(min){clearTimeout(timer);timer=setTimeout(()=>{audio.pause();toast('취침 타이머로 재생을 멈췄습니다')},min*60000);closeModal();toast(min+'분 후 재생이 정지됩니다')}
$('#timer15').onclick=()=>setTimer(15);$('#timer30').onclick=()=>setTimer(30);$('#timerOff').onclick=()=>{clearTimeout(timer);timer=null;closeModal();toast('취침 타이머가 꺼졌습니다')};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}if(e.key==='ArrowRight')audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);if(e.key==='ArrowLeft')audio.currentTime=Math.max(0,audio.currentTime-5)});
audio.volume=.8;load(0);
</script>
</body></html>
